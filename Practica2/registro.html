<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="form-container">
        <h2>Crear Cuenta</h2>
        <form id="form-registro">
            <input type="text" id="reg-user" placeholder="Usuario" required>
            <input type="password" id="reg-pass" placeholder="Contraseña" required>
            <input type="password" id="reg-conf" placeholder="Confirmar Contraseña" required>
            <input type="text" id="reg-preg" placeholder="Pregunta Secreta (ej. Mascota)" required>
            <input type="text" id="reg-resp" placeholder="Respuesta" required>
            <button type="submit">Registrar</button>
            <p id="msg"></p>
        </form>
        <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>

    </script>
</body>
</html>
