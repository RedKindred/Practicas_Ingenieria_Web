<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="css/style.css
    ">
</head>
<body>
    <div class="form-container">
        <h2>Inicio de Sesión</h2>
        <form id="form-login">
            <input type="text" id="log-user" placeholder="Usuario" required>
            <input type="password" id="log-pass" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
            <p id="msg"></p>
        </form>
        <div class="links">
            <a href="registro.html">Registrarse</a> | 
            <a href="recuperar.html">Olvidé mi contraseña</a>
        </div>
    </div>
    <script>
        document.getElementById('form-login').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('log-user').value;
            const pass = document.getElementById('log-pass').value;
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            const valido = usuarios.find(u => u.user === user && u.pass === pass);

            if (valido) {
                alert("Bienvenido al sistema");
            } else {
                document.getElementById('msg').innerText = "Usuario o contraseña incorrectos";
            }
        });
    </script>
</body>
</html>
